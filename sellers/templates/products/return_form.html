<!DOCTYPE html>
<html>
<head>
    <title>Request Return</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f6f8;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 30px;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        textarea {
            width: 100%;
            height: 100px;
        }

        button {
            padding: 8px 12px;
            background: #3498db;
            color: white;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<header>
    <h2>Request Return</h2>
</header>

<div class="container">
    <h3>Order #{{ order_item.order.order_number }}</h3>
    <p><strong>Item:</strong> {{ order_item.product_name }}</p>
    <p><strong>Seller:</strong> {{ order_item.seller.username }}</p>

    <form method="POST">
        {% csrf_token %}

        <label>Reason for return:</label><br>
        <textarea name="reason" required></textarea><br>

        <button type="submit">Submit Request</button>
    </form>

    <a href="{% url 'buyer_order_history' %}">Cancel</a>
</div>

</body>
</html>
