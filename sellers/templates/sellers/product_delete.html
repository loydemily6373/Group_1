<!DOCTYPE html>
<html>
<head>
    <title>Delete Product</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 30px;
        }

        .container {
            padding: 30px;
            max-width: 700px;
            margin: 40px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            text-decoration: none;
            margin-right: 10px;
        }

        .btn-danger {
            background-color: #e74c3c;
        }

        .btn-secondary {
            background-color: #3498db;
        }
    </style>
</head>

<body>

    <header>
        <h1>Delete Product</h1>
    </header>

    <div class="container">
        <h2>Are you sure?</h2>
        <p>You are about to delete <strong>{{ product.product_name }}</strong>.</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>

</body>
</html>
