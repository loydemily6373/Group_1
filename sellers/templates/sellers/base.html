<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}ThreadSwitch Seller{% endblock %}</title>

    <script>
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>

    <style>
        /* Sticky footer */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body > footer {
            margin-top: auto;
        }

        /* Form base styles */
        .form-card,
        .card {
            background: white;
            padding: 22px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-card h2,
        .card h2 {
            margin-top: 0;
            color: #2c3e50;
        }

        .field,
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #2c3e50;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd5dd;
            border-radius: 6px;
            box-sizing: border-box;
            background: #fff;
            font-size: 1rem;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .helptext,
        .help-text {
            display: block;
            margin-top: 5px;
            color: #6b7280;
            font-size: 0.85rem;
        }

        .errorlist {
            color: #991b1b;
            margin: 5px 0;
            padding-left: 20px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .actions,
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
            color: white;
        }

        .btn:hover { opacity: 0.92; }
        .btn-primary { background-color: #27ae60; }
        .btn-secondary { background-color: #3498db; text-align: center; }
        .btn-danger { background-color: #e74c3c; }
        .btn-warning { background-color: #f59e0b; }

        /* Dark mode */
        .dark-mode body {
            background-color: #0f172a;
            color: #e2e8f0;
        }

        .dark-mode header,
        .dark-mode nav,
        .dark-mode footer {
            background-color: #020617;
        }

        .dark-mode .product-card {
            background: #1e293b;
            color: #e2e8f0;
        }

        .dark-mode table {
            background: #1e293b;
            color: #e2e8f0;
        }

        .dark-mode th {
            background: #1d4ed8;
            color: #f8fafc;
        }

        .dark-mode td {
            border-bottom-color: #334155;
        }

        .dark-mode tr:nth-child(even) {
            background: #0f172a;
        }

        .dark-mode tr:hover {
            background: #273549;
        }

        .dark-mode .card,
        .dark-mode .form-card,
        .dark-mode .order-card,
        .dark-mode .summary-card,
        .dark-mode .webhook-card,
        .dark-mode .review-card,
        .dark-mode .stats,
        .dark-mode .no-reviews,
        .dark-mode .no-products,
        .dark-mode .container > table {
            background: #1e293b;
            color: #e2e8f0;
        }

        .dark-mode .summary-card {
            background: #0f4f3f;
        }

        .dark-mode .warning-box {
            background: #3b1212;
            border-color: #7f1d1d;
        }

        .dark-mode .warning-box p {
            color: #fca5a5;
        }

        .dark-mode .product-info {
            background: #1e293b;
            color: #e2e8f0;
        }

        .dark-mode .review-comment {
            background: #0f172a;
            color: #cbd5e1;
        }

        .dark-mode .reviewer-name,
        .dark-mode .review-title,
        .dark-mode .webhook-card h2,
        .dark-mode .webhook-url-section label {
            color: #e2e8f0;
        }

        .dark-mode .review-meta,
        .dark-mode .review-date,
        .dark-mode .product-name,
        .dark-mode .stat-label {
            color: #94a3b8;
        }

        .dark-mode input,
        .dark-mode select,
        .dark-mode textarea {
            background: #0f172a;
            color: #e2e8f0;
            border-color: #334155;
        }

        .dark-mode .webhook-url-input {
            background: #0f172a;
            color: #94a3b8;
            border-color: #334155;
        }

        .dark-mode .notification {
            background: #1e3a5f;
            border-left-color: #3b82f6;
        }

        .dark-mode .notification-content strong {
            color: #e2e8f0;
        }

        .dark-mode .notification-content small {
            color: #94a3b8;
        }

        .dark-mode label {
            color: #e2e8f0;
        }

        .dark-mode .helptext,
        .dark-mode .help-text {
            color: #94a3b8;
        }

        .dark-mode .error {
            background: #3b1212;
            color: #fca5a5;
            border-color: #7f1d1d;
        }

        .dark-mode .errorlist {
            color: #fca5a5;
        }

        .dark-mode input:focus,
        .dark-mode select:focus,
        .dark-mode textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 5px rgba(59, 130, 246, 0.3);
        }

        .dark-mode .form-card h2,
        .dark-mode .card h2 {
            color: #e2e8f0;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>
<button id="darkModeToggle"
        style="position: fixed; top: 15px; right: 15px; font-size: 1.5rem;
               background: none; border: none; cursor: pointer; z-index: 9999;">
    🌙
</button>

{% block content %}{% endblock %}

<script>
const darkModeToggle = document.getElementById('darkModeToggle');

if (localStorage.getItem('darkMode') === 'enabled') {
    darkModeToggle.textContent = '☀️';
} else {
    darkModeToggle.textContent = '🌙';
}

darkModeToggle.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark-mode');

    if (document.documentElement.classList.contains('dark-mode')) {
        localStorage.setItem('darkMode', 'enabled');
        darkModeToggle.textContent = '☀️';
    } else {
        localStorage.setItem('darkMode', 'disabled');
        darkModeToggle.textContent = '🌙';
    }
});
</script>

{% block extra_js %}{% endblock %}

</body>
</html>
